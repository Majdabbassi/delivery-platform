# Test profile: runs against an in-memory H2 database so tests pass without MySQL
spring:
  datasource:
    url: jdbc:h2:mem:upstart_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
jwt:
  secret: dGVzdC1zZWNyZXQta2V5LWZvci11cHN0YXJ0LXRlc3RzLTAxMjM0NTY3ODk=
  issuer: upstart-backend-test
  audience: upstart-frontend-test
  expiration: 86400000
  refresh:
    expiration: 604800000

security:
  rate-limiting:
    max-attempts: 100000
    lockout-duration-minutes: 1
    cleanup-interval-minutes: 60
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:4200
      - http://localhost:8080

server:
  forward-headers-strategy: framework

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: WARN