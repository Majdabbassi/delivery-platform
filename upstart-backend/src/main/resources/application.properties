spring.application.name=upstart-backend

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/upstart_db_new}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Allow circular references to resolve dependency cycle
spring.main.allow-circular-references=true

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Logging Configuration
logging.level.com.upstart.backend=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Security Configuration
# Note: The first Super Admin is bootstrapped by DataInitializer from
# ADMIN_USERNAME / ADMIN_PASSWORD (see .env.example). No default in-memory
# user is required here.

# JWT Configuration
jwt.secret=${JWT_SECRET:REDACTED_JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Assignment Configuration
# General assignment settings
upstart.assignment.general.auto-assignment-enabled=true
upstart.assignment.general.prefer-partnerships=true
upstart.assignment.general.max-assignment-attempts=3
upstart.assignment.general.assignment-timeout-seconds=30
upstart.assignment.general.audit-logging-enabled=true
upstart.assignment.general.min-score-threshold=0.3

# Partnership settings
upstart.assignment.partnership.exclusive-priority-enabled=true
upstart.assignment.partnership.min-recommendation-score=0.6
upstart.assignment.partnership.max-partnerships-to-evaluate=10
upstart.assignment.partnership.conflict-detection-enabled=true
upstart.assignment.partnership.expiration-check-days=30
upstart.assignment.partnership.min-orders-for-performance-eval=10
upstart.assignment.partnership.performance-evaluation-days=90

# Scoring weights for partnerships
upstart.assignment.scoring.partnership-weights.rating=0.25
upstart.assignment.scoring.partnership-weights.reliability=0.20
upstart.assignment.scoring.partnership-weights.cost=0.20
upstart.assignment.scoring.partnership-weights.speed=0.15
upstart.assignment.scoring.partnership-weights.capacity=0.10
upstart.assignment.scoring.partnership-weights.history=0.10

# Scoring weights for delivery companies
upstart.assignment.scoring.delivery-company-weights.rating=0.30
upstart.assignment.scoring.delivery-company-weights.availability=0.25
upstart.assignment.scoring.delivery-company-weights.cost=0.20
upstart.assignment.scoring.delivery-company-weights.distance=0.15
upstart.assignment.scoring.delivery-company-weights.capacity=0.10

# Bonus and penalty settings
upstart.assignment.scoring.bonus-penalty.exclusive-partnership-bonus=0.1
upstart.assignment.scoring.bonus-penalty.long-term-partnership-bonus=0.05
upstart.assignment.scoring.bonus-penalty.high-value-order-bonus=0.05
upstart.assignment.scoring.bonus-penalty.service-area-match-bonus=0.05
upstart.assignment.scoring.bonus-penalty.high-rating-bonus=0.05
upstart.assignment.scoring.bonus-penalty.inactivity-penalty=0.2

# Distance calculation settings
upstart.assignment.distance.max-delivery-distance-km=50
upstart.assignment.distance.default-area-type=suburban
upstart.assignment.distance.base-delivery-time-minutes=15
upstart.assignment.distance.driving-distance-multiplier=1.3

# Retry and fallback settings
upstart.assignment.retry.auto-retry-enabled=true
upstart.assignment.retry.max-retry-attempts=2
upstart.assignment.retry.retry-delay-seconds=5
upstart.assignment.retry.fallback-enabled=true
upstart.assignment.retry.fallback-score-reduction=0.2

# Performance settings
upstart.assignment.performance.caching-enabled=true
upstart.assignment.performance.cache-ttl-minutes=30
upstart.assignment.performance.parallel-processing-enabled=true
upstart.assignment.performance.max-thread-pool-size=5
upstart.assignment.performance.metrics-enabled=true
upstart.assignment.performance.batch-size=50