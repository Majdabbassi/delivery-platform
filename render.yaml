# Render blueprint: the SwiftDeliver API on the free plan, built from its Dockerfile.
# (Render has no native Java runtime, and the app speaks MySQL, so this uses Docker + an external MySQL.)
# The web app is deployed separately to GitHub Pages (.github/workflows/pages.yml).
services:
  - type: web
    name: swiftdeliver-api
    runtime: docker
    plan: free
    dockerfilePath: ./swiftdeliver-backend/Dockerfile
    dockerContext: ./swiftdeliver-backend
    healthCheckPath: /actuator/health
    autoDeploy: true
    # Only rebuild (and restart) for backend changes.
    buildFilter:
      paths:
        - swiftdeliver-backend/**
        - render.yaml
    envVars:
      # "prod": the backend refuses to start with a weak or public JWT secret.
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # 512 MB instance: keep the heap small.
      - key: JAVA_TOOL_OPTIONS
        value: -Xmx320m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m
      # the web app's address, e.g. https://swiftdeliver.vercel.app (set in the Render dashboard)
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # --- set these in the Render dashboard (never commit them) ---
      - key: DATABASE_URL      # jdbc:mysql://HOST:PORT/DB?sslMode=VERIFY_IDENTITY (TLS for managed MySQL)
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
