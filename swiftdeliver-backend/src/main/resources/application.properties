spring.application.name=swiftdeliver-backend

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/swiftdeliver_db_new}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Allow circular references to resolve dependency cycle
spring.main.allow-circular-references=true

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# Logging Configuration
logging.level.com.swiftdeliver.backend=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Security Configuration
# Note: The first Super Admin is bootstrapped by DataInitializer from
# ADMIN_USERNAME / ADMIN_PASSWORD (see .env.example). No default in-memory
# user is required here.

# JWT Configuration
jwt.secret=${JWT_SECRET:REDACTED_JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Assignment Configuration
# General assignment settings
swiftdeliver.assignment.general.auto-assignment-enabled=true
swiftdeliver.assignment.general.auto-assign-on-create=true
swiftdeliver.assignment.general.prefer-partnerships=true
swiftdeliver.assignment.general.max-assignment-attempts=3
swiftdeliver.assignment.general.assignment-timeout-seconds=30
swiftdeliver.assignment.general.audit-logging-enabled=true
swiftdeliver.assignment.general.min-score-threshold=0.3

# Partnership settings
swiftdeliver.assignment.partnership.exclusive-priority-enabled=true
swiftdeliver.assignment.partnership.min-recommendation-score=0.6
swiftdeliver.assignment.partnership.max-partnerships-to-evaluate=10
swiftdeliver.assignment.partnership.conflict-detection-enabled=true
swiftdeliver.assignment.partnership.expiration-check-days=30
swiftdeliver.assignment.partnership.min-orders-for-performance-eval=10
swiftdeliver.assignment.partnership.performance-evaluation-days=90

# Scoring weights for partnerships
swiftdeliver.assignment.scoring.partnership-weights.rating=0.25
swiftdeliver.assignment.scoring.partnership-weights.reliability=0.20
swiftdeliver.assignment.scoring.partnership-weights.cost=0.20
swiftdeliver.assignment.scoring.partnership-weights.speed=0.15
swiftdeliver.assignment.scoring.partnership-weights.capacity=0.10
swiftdeliver.assignment.scoring.partnership-weights.history=0.10

# Scoring weights for delivery companies
swiftdeliver.assignment.scoring.delivery-company-weights.rating=0.30
swiftdeliver.assignment.scoring.delivery-company-weights.availability=0.25
swiftdeliver.assignment.scoring.delivery-company-weights.cost=0.20
swiftdeliver.assignment.scoring.delivery-company-weights.distance=0.15
swiftdeliver.assignment.scoring.delivery-company-weights.capacity=0.10

# Bonus and penalty settings
swiftdeliver.assignment.scoring.bonus-penalty.exclusive-partnership-bonus=0.1
swiftdeliver.assignment.scoring.bonus-penalty.long-term-partnership-bonus=0.05
swiftdeliver.assignment.scoring.bonus-penalty.high-value-order-bonus=0.05
swiftdeliver.assignment.scoring.bonus-penalty.service-area-match-bonus=0.05
swiftdeliver.assignment.scoring.bonus-penalty.high-rating-bonus=0.05
swiftdeliver.assignment.scoring.bonus-penalty.inactivity-penalty=0.2

# Distance calculation settings
swiftdeliver.assignment.distance.max-delivery-distance-km=50
swiftdeliver.assignment.distance.default-area-type=suburban
swiftdeliver.assignment.distance.base-delivery-time-minutes=15
swiftdeliver.assignment.distance.driving-distance-multiplier=1.3

# Driver watchdog (opt-in)
swiftdeliver.assignment.driver.watchdog-enabled=false
swiftdeliver.assignment.driver.inactivity-minutes=30

# Retry and fallback settings
swiftdeliver.assignment.retry.auto-retry-enabled=true
swiftdeliver.assignment.retry.max-retry-attempts=2
swiftdeliver.assignment.retry.retry-delay-seconds=5
swiftdeliver.assignment.retry.fallback-enabled=true
swiftdeliver.assignment.retry.fallback-score-reduction=0.2

# Performance settings
swiftdeliver.assignment.performance.caching-enabled=true
swiftdeliver.assignment.performance.cache-ttl-minutes=30
swiftdeliver.assignment.performance.parallel-processing-enabled=true
swiftdeliver.assignment.performance.max-thread-pool-size=5
swiftdeliver.assignment.performance.metrics-enabled=true
swiftdeliver.assignment.performance.batch-size=50
# Order creation rate limiting (per-user, fixed window)
swiftdeliver.orders.rate-limit.per-minute=20
