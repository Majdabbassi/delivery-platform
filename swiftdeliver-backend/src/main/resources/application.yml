spring:
  application:
    name: swiftdeliver-backend

  # Local `mvnw spring-boot:run` runs under `dev` (demo seeding, dev-only tools);
  # an explicit SPRING_PROFILES_ACTIVE (docker compose `dev`, Render `prod`) overrides this default.
  profiles:
    default: dev

  # Database — defaults target a local dev MySQL; DATABASE_URL overrides in compose/prod.
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/swiftdeliver_db_new}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA/Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-stacktrace: never
    include-message: never

# Actuator / metrics
management:
  server:
    # Empty = same port as the API. docker-compose sets it to 8081 (never published) so Prometheus
    # can scrape /actuator/prometheus without that endpoint being reachable from outside.
    port: ${MANAGEMENT_PORT:}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
  metrics:
    export:
      prometheus:
        enabled: true

# Logging — sane defaults; DEBUG/TRACE is noisy and can leak query data in prod.
logging:
  level:
    com.swiftdeliver.backend: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN

# JWT
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}          # access token, 24h
  refresh:
    expiration: ${JWT_REFRESH_EXPIRATION:604800000} # refresh token, 7d
  issuer: ${JWT_ISSUER:swiftdeliver-backend}
  blacklist:
    cleanup:
      interval: ${JWT_BLACKLIST_CLEANUP_INTERVAL:1} # hours
    max:
      size: ${JWT_BLACKLIST_MAX_SIZE:10000}

# Login rate limiting
security:
  rate-limiting:
    max-attempts: ${RATE_LIMIT_MAX_ATTEMPTS:5}
    lockout-duration-minutes: ${RATE_LIMIT_LOCKOUT_DURATION:15}
    cleanup-interval-minutes: ${RATE_LIMIT_CLEANUP_INTERVAL:60}
    # Comma-separated allowlist of reverse-proxy IPs allowed to set
    # X-Forwarded-For / X-Real-IP. Leave empty (default) to only use the real
    # socket peer IP, so clients cannot spoof their address past the limiter.
    # When deployed behind a proxy, set RATE_LIMIT_TRUSTED_PROXIES to it.
    trusted-proxies: ${RATE_LIMIT_TRUSTED_PROXIES:}

# CORS — consumed by SecurityConfig (single source of truth)
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost,http://localhost:80}

# Order creation rate limiting
swiftdeliver:
  orders:
    rate-limit:
      per-minute: ${ORDER_RATE_LIMIT_PER_MINUTE:20}

  # General assignment settings
  assignment:
    general:
      auto-assignment-enabled: true
      auto-assign-on-create: true
      prefer-partnerships: true
      max-assignment-attempts: 3
      assignment-timeout-seconds: 30
      audit-logging-enabled: true
      min-score-threshold: 0.3

    # Partnership settings
    partnership:
      exclusive-priority-enabled: true
      min-recommendation-score: 0.6
      max-partnerships-to-evaluate: 10
      conflict-detection-enabled: true
      expiration-check-days: 30
      min-orders-for-performance-eval: 10
      performance-evaluation-days: 90

    # Scoring weights for partnerships
    scoring:
      partnership-weights:
        rating: 0.25
        reliability: 0.20
        cost: 0.20
        speed: 0.15
        capacity: 0.10
        history: 0.10

      # Scoring weights for delivery companies
      delivery-company-weights:
        rating: 0.30
        availability: 0.25
        cost: 0.20
        distance: 0.15
        capacity: 0.10

      # Bonus and penalty settings
      bonus-penalty:
        exclusive-partnership-bonus: 0.1
        long-term-partnership-bonus: 0.05
        high-value-order-bonus: 0.05
        service-area-match-bonus: 0.05
        high-rating-bonus: 0.05
        inactivity-penalty: 0.2

    # Distance calculation settings
    distance:
      max-delivery-distance-km: 50
      default-area-type: suburban
      base-delivery-time-minutes: 15
      driving-distance-multiplier: 1.3

    # Driver watchdog (opt-in)
    driver:
      watchdog-enabled: false
      inactivity-minutes: 30

    # Retry and fallback settings
    retry:
      auto-retry-enabled: true
      max-retry-attempts: 2
      retry-delay-seconds: 5
      fallback-enabled: true
      fallback-score-reduction: 0.2

    # Performance settings
    performance:
      caching-enabled: true
      cache-ttl-minutes: 30
      parallel-processing-enabled: true
      max-thread-pool-size: 5
      metrics-enabled: true
      batch-size: 50

---
# Production profile — Render/cloud deployment (SPRING_PROFILES_ACTIVE=prod)
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME:swiftdeliver_user}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:4200,http://localhost,http://localhost:80}