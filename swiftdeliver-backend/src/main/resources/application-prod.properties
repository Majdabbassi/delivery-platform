# Database — Render provides DATABASE_URL as a JDBC URL
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME:swiftdeliver_user}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# If Render gives you a PostgreSQL URL instead of MySQL, change driver:
# spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Security
security.rate-limiting.max-attempts=5
security.rate-limiting.lockout-duration-minutes=15

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# CORS — update this once frontend is deployed on Vercel
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:4200}