<div class="register-container">
  <div class="register-wrapper">
    <div class="background-shapes">
      <div class="shape shape-1"></div>
      <div class="shape shape-2"></div>
      <div class="shape shape-3"></div>
    </div>

    <div class="register-card">
      <div class="register-header">
        <div class="logo">
          <i class="fas fa-truck"></i>
          <h1>UpStart</h1>
        </div>
        <h2>Become a Driver</h2>
        <p>Register as an independent driver to bid on and deliver orders</p>
      </div>

      <div class="success-message" *ngIf="success">
        <i class="fas fa-check-circle"></i>
        <span>Driver account created successfully! Please sign in and wait for verification before taking jobs.</span>
        <button class="btn btn-primary" (click)="goToLogin()">
          <i class="fas fa-sign-in-alt"></i>
          Go to Sign In
        </button>
      </div>

      <div class="error-message" *ngIf="error">
        <i class="fas fa-exclamation-triangle"></i>
        <span>{{ error }}</span>
        <button class="close-error" (click)="error = ''">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <form class="register-form" (ngSubmit)="onSubmit()" *ngIf="!success">
        <div class="form-row">
          <div class="form-group">
            <label for="firstName"><i class="fas fa-user"></i> First Name *</label>
            <input
              type="text"
              id="firstName"
              name="firstName"
              [(ngModel)]="registerForm.firstName"
              placeholder="Enter your first name"
              required
              [disabled]="loading"
              class="form-input"
            >
          </div>
          <div class="form-group">
            <label for="lastName"><i class="fas fa-user"></i> Last Name *</label>
            <input
              type="text"
              id="lastName"
              name="lastName"
              [(ngModel)]="registerForm.lastName"
              placeholder="Enter your last name"
              required
              [disabled]="loading"
              class="form-input"
            >
          </div>
        </div>

        <div class="form-group">
          <label for="username"><i class="fas fa-at"></i> Username *</label>
          <input
            type="text"
            id="username"
            name="username"
            [(ngModel)]="registerForm.username"
            placeholder="Choose a username"
            required
            autocomplete="username"
            [disabled]="loading"
            class="form-input"
          >
        </div>

        <div class="form-group">
          <label for="email"><i class="fas fa-envelope"></i> Email Address *</label>
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="registerForm.email"
            placeholder="Enter your email address"
            required
            autocomplete="email"
            [disabled]="loading"
            class="form-input"
          >
        </div>

        <div class="form-group">
          <label for="phoneNumber"><i class="fas fa-phone"></i> Phone Number</label>
          <input
            type="tel"
            id="phoneNumber"
            name="phoneNumber"
            [(ngModel)]="registerForm.phoneNumber"
            placeholder="Enter your phone number"
            autocomplete="tel"
            [disabled]="loading"
            class="form-input"
          >
        </div>

        <div class="form-group">
          <label for="licenseNumber"><i class="fas fa-id-card"></i> Driver License Number</label>
          <input
            type="text"
            id="licenseNumber"
            name="licenseNumber"
            [(ngModel)]="registerForm.licenseNumber"
            placeholder="Enter your license number"
            [disabled]="loading"
            class="form-input"
          >
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="vehicleType"><i class="fas fa-motorcycle"></i> Vehicle Type</label>
            <select
              id="vehicleType"
              name="vehicleType"
              [(ngModel)]="registerForm.vehicleType"
              [disabled]="loading"
              class="form-input"
            >
              <option *ngFor="let type of vehicleTypeOptions" [value]="type">{{ type }}</option>
            </select>
          </div>
          <div class="form-group">
            <label for="vehiclePlate"><i class="fas fa-car"></i> Vehicle Plate</label>
            <input
              type="text"
              id="vehiclePlate"
              name="vehiclePlate"
              [(ngModel)]="registerForm.vehiclePlate"
              placeholder="Enter plate number"
              [disabled]="loading"
              class="form-input"
            >
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="vehicleModel"><i class="fas fa-cog"></i> Vehicle Model</label>
            <input
              type="text"
              id="vehicleModel"
              name="vehicleModel"
              [(ngModel)]="registerForm.vehicleModel"
              placeholder="e.g. Toyota Corolla 2019"
              [disabled]="loading"
              class="form-input"
            >
          </div>
          <div class="form-group">
            <label for="vehicleColor"><i class="fas fa-palette"></i> Vehicle Color</label>
            <input
              type="text"
              id="vehicleColor"
              name="vehicleColor"
              [(ngModel)]="registerForm.vehicleColor"
              placeholder="e.g. White"
              [disabled]="loading"
              class="form-input"
            >
          </div>
        </div>

        <div class="form-group">
          <label for="deliveryZone"><i class="fas fa-map-marker-alt"></i> Preferred Delivery Zone</label>
          <input
            type="text"
            id="deliveryZone"
            name="deliveryZone"
            [(ngModel)]="registerForm.deliveryZone"
            placeholder="e.g. City Center"
            [disabled]="loading"
            class="form-input"
          >
        </div>

        <div class="form-group">
          <label for="password"><i class="fas fa-lock"></i> Password *</label>
          <div class="input-wrapper">
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              name="password"
              [(ngModel)]="registerForm.password"
              placeholder="At least 8 characters"
              required
              autocomplete="new-password"
              [disabled]="loading"
              class="form-input"
            >
            <button
              type="button"
              class="password-toggle"
              (click)="togglePasswordVisibility()"
              [disabled]="loading"
            >
              <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword"><i class="fas fa-lock"></i> Confirm Password *</label>
          <div class="input-wrapper">
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="confirmPassword"
              name="confirmPassword"
              [(ngModel)]="confirmPassword"
              placeholder="Re-enter your password"
              required
              autocomplete="new-password"
              [disabled]="loading"
              class="form-input"
            >
          </div>
        </div>

        <button
          type="submit"
          class="register-button"
          [disabled]="loading"
          [class.loading]="loading"
        >
          <span *ngIf="!loading">
            <i class="fas fa-user-plus"></i>
            Register as Driver
          </span>
          <span *ngIf="loading" class="loading-content">
            <i class="fas fa-spinner fa-spin"></i>
            Creating Account...
          </span>
        </button>
      </form>

      <div class="register-footer">
        <p>Already have an account?</p>
        <button type="button" class="login-link" (click)="goToLogin()" [disabled]="loading">
          <i class="fas fa-sign-in-alt"></i>
          Sign In
        </button>
      </div>
    </div>
  </div>
</div>
