<div class="register-container">
  <div class="register-wrapper">
    <div class="background-shapes">
      <div class="shape shape-1"></div>
      <div class="shape shape-2"></div>
      <div class="shape shape-3"></div>
    </div>

    <div class="register-card">
      <div class="register-header">
        <div class="logo">
          <i class="fas fa-rocket"></i>
          <h1>UpStart</h1>
        </div>
        <h2>Create Account</h2>
        <p>Join UpStart to start placing and managing delivery orders</p>
      </div>

      <div class="success-message" *ngIf="success">
        <i class="fas fa-check-circle"></i>
        <span>Account created successfully! You can now sign in.</span>
        <button class="btn btn-primary" (click)="goToLogin()">
          <i class="fas fa-sign-in-alt"></i>
          Go to Sign In
        </button>
      </div>

      <div class="error-message" *ngIf="error">
        <i class="fas fa-exclamation-triangle"></i>
        <span>{{ error }}</span>
        <button class="close-error" (click)="error = ''">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <form class="register-form" (ngSubmit)="onSubmit()" *ngIf="!success">
        <div class="form-row">
          <div class="form-group">
            <label for="firstName">First Name *</label>
            <input
              type="text"
              id="firstName"
              name="firstName"
              [(ngModel)]="registerForm.firstName"
              placeholder="Enter your first name"
              required
              [disabled]="loading"
              class="form-input"
            >
          </div>
          <div class="form-group">
            <label for="lastName">Last Name *</label>
            <input
              type="text"
              id="lastName"
              name="lastName"
              [(ngModel)]="registerForm.lastName"
              placeholder="Enter your last name"
              required
              [disabled]="loading"
              class="form-input"
            >
          </div>
        </div>

        <div class="form-group">
          <label for="username">Username *</label>
          <input
            type="text"
            id="username"
            name="username"
            [(ngModel)]="registerForm.username"
            placeholder="Choose a username"
            required
            autocomplete="username"
            [disabled]="loading"
            class="form-input"
          >
        </div>

        <div class="form-group">
          <label for="email">Email Address *</label>
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="registerForm.email"
            placeholder="Enter your email address"
            required
            autocomplete="email"
            [disabled]="loading"
            class="form-input"
          >
        </div>

        <div class="form-group">
          <label for="phoneNumber">Phone Number</label>
          <input
            type="tel"
            id="phoneNumber"
            name="phoneNumber"
            [(ngModel)]="registerForm.phoneNumber"
            placeholder="Enter your phone number"
            autocomplete="tel"
            [disabled]="loading"
            class="form-input"
          >
        </div>

        <div class="form-group">
          <label for="password">Password *</label>
          <div class="input-wrapper">
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              name="password"
              [(ngModel)]="registerForm.password"
              placeholder="At least 8 characters"
              required
              autocomplete="new-password"
              [disabled]="loading"
              class="form-input"
            >
            <button
              type="button"
              class="password-toggle"
              (click)="togglePasswordVisibility()"
              [disabled]="loading"
            >
              <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password *</label>
          <div class="input-wrapper">
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="confirmPassword"
              name="confirmPassword"
              [(ngModel)]="confirmPassword"
              placeholder="Re-enter your password"
              required
              autocomplete="new-password"
              [disabled]="loading"
              class="form-input"
            >
          </div>
        </div>

        <button
          type="submit"
          class="register-button"
          [disabled]="loading"
          [class.loading]="loading"
        >
          <span *ngIf="!loading">
            <i class="fas fa-user-plus"></i>
            Create Account
          </span>
          <span *ngIf="loading" class="loading-content">
            <i class="fas fa-spinner fa-spin"></i>
            Creating Account...
          </span>
        </button>
      </form>

      <div class="register-footer">
        <p>Already have an account?</p>
        <button type="button" class="login-link" (click)="goToLogin()" [disabled]="loading">
          <i class="fas fa-sign-in-alt"></i>
          Sign In
        </button>
      </div>
    </div>
  </div>
</div>
