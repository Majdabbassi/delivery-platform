services:
  db:
    image: mysql:8.0
    container_name: swiftdeliver-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: swiftdeliver_db_new
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-CHANGE_ME}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-CHANGE_ME}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - swiftdeliver-net

  backend:
    build: ./swiftdeliver-backend
    container_name: swiftdeliver-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:mysql://db:3306/swiftdeliver_db_new
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-CHANGE_ME}
      JWT_SECRET: ${JWT_SECRET:-CHANGE_ME}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-CHANGE_ME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-CHANGE_ME}
      SPRING_PROFILES_ACTIVE: dev
    networks:
      - swiftdeliver-net

  web:
    build: ./swiftdeliver-frontend
    container_name: swiftdeliver-web
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - swiftdeliver-net

  nginx:
    image: nginx:alpine
    container_name: swiftdeliver-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - web
    networks:
      - swiftdeliver-net

  prometheus:
    image: prom/prometheus:latest
    container_name: swiftdeliver-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - swiftdeliver-net

  grafana:
    image: grafana/grafana:latest
    container_name: swiftdeliver-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-CHANGE_ME}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - swiftdeliver-net

networks:
  swiftdeliver-net:
    driver: bridge

volumes:
  mysql-data:
  prometheus-data:
  grafana-data: