services:
  db:
    image: mysql:8.0
    container_name: swiftdeliver-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: swiftdeliver_db_new
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-CHANGE_ME}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-CHANGE_ME}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - swiftdeliver-net

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: swiftdeliver-phpmyadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-CHANGE_ME}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - swiftdeliver-net

  backend:
    build: ./swiftdeliver-backend
    container_name: swiftdeliver-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:mysql://db:3306/swiftdeliver_db_new
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-CHANGE_ME}
      # A development secret so the local quick start works; the app warns about it. Set JWT_SECRET in .env.
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      MANAGEMENT_PORT: "8081"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123!}
      SPRING_PROFILES_ACTIVE: dev
    networks:
      - swiftdeliver-net

  web:
    build: ./swiftdeliver-frontend
    container_name: swiftdeliver-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:4200:80"
    depends_on:
      - backend
    networks:
      - swiftdeliver-net

  nginx:
    image: nginx:alpine
    container_name: swiftdeliver-nginx
    restart: unless-stopped
    profiles: ["deploy"]
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - web
    networks:
      - swiftdeliver-net

  prometheus:
    image: prom/prometheus:latest
    container_name: swiftdeliver-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - swiftdeliver-net

  grafana:
    image: grafana/grafana:latest
    container_name: swiftdeliver-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-CHANGE_ME}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      # Datasource and dashboard are provisioned, so monitoring works on first start.
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - swiftdeliver-net

networks:
  swiftdeliver-net:
    driver: bridge

volumes:
  mysql-data:
  prometheus-data:
  grafana-data: