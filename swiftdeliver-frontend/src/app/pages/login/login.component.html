<div class="login-container">
  <div class="login-card">
    <!-- Logo and Header -->
    <div class="login-header">
      <div class="logo">
        <i class="fas fa-rocket"></i>
        <h1>SwiftDeliver</h1>
      </div>
      <h2>Welcome Back</h2>
      <p>Sign in to your account to continue</p>
    </div>

    <!-- Error Message -->
    <div class="error-message" *ngIf="error" [class.show]="error">
      <i class="fas fa-exclamation-triangle"></i>
      <span>{{ error }}</span>
      <button class="close-error" (click)="clearError()">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <!-- Login Form -->
    <form class="login-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <!-- Username/Email Field -->
      <div class="form-group">
        <label for="usernameOrEmail">
          <i class="fas fa-user"></i>
          Username or Email
        </label>
        <input
          type="text"
          id="usernameOrEmail"
          formControlName="usernameOrEmail"
          placeholder="Enter your username or email"
          autocomplete="username"
          class="form-input"
          [class.input-error]="loginForm.get('usernameOrEmail')?.touched && loginForm.get('usernameOrEmail')?.invalid"
        >
        <small class="field-error" *ngIf="loginForm.get('usernameOrEmail')?.touched && loginForm.get('usernameOrEmail')?.invalid">
          Username or email is required
        </small>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password">
          <i class="fas fa-lock"></i>
          Password
        </label>
        <div class="input-wrapper">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            formControlName="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            class="form-input"
            [class.input-error]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
          >
          <button
            type="button"
            class="password-toggle"
            (click)="togglePasswordVisibility()"
            [disabled]="loading"
            aria-label="Toggle password visibility"
          >
            <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
          </button>
        </div>
        <small class="field-error" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
          Password is required
        </small>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        class="login-button"
        [disabled]="loading || loginForm.invalid"
        [class.loading]="loading"
      >
        <span *ngIf="!loading">
          <i class="fas fa-sign-in-alt"></i>
          Sign In
        </span>
        <span *ngIf="loading" class="loading-content">
          <i class="fas fa-spinner fa-spin"></i>
          Signing In...
        </span>
      </button>
    </form>

    <!-- Footer -->
    <div class="login-footer">
      <p>Don't have an account?</p>
      <button
        type="button"
        class="register-button"
        (click)="onRegister()"
        [disabled]="loading"
      >
        <i class="fas fa-user-plus"></i>
        Create Account
      </button>
      <button
        type="button"
        class="register-button driver"
        (click)="onDriverRegister()"
        [disabled]="loading"
      >
        <i class="fas fa-truck"></i>
        Register as a Driver
      </button>
    </div>
  </div>
</div>
