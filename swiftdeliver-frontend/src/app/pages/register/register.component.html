<div class="register-container">
  <div class="register-card">
      <div class="register-header">
        <div class="logo">
          <i class="fas fa-rocket"></i>
          <h1>SwiftDeliver</h1>
        </div>
        <h2>Create Account</h2>
        <p>Join SwiftDeliver to start placing and managing delivery orders</p>
      </div>

      <div class="success-message" *ngIf="success">
        <i class="fas fa-check-circle"></i>
        <span>Account created successfully! You can now sign in.</span>
        <button class="btn btn-primary" (click)="goToLogin()">
          <i class="fas fa-sign-in-alt"></i>
          Go to Sign In
        </button>
      </div>

      <div class="error-message" *ngIf="error">
        <i class="fas fa-exclamation-triangle"></i>
        <span>{{ error }}</span>
        <button class="close-error" (click)="error = ''">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <form class="register-form" [formGroup]="registerForm" (ngSubmit)="onSubmit()" *ngIf="!success">
        <div class="form-row">
          <div class="form-group">
            <label for="firstName">First Name *</label>
            <input
              type="text"
              id="firstName"
              formControlName="firstName"
              placeholder="Enter your first name"
              [disabled]="loading"
              class="form-input"
              [class.input-error]="registerForm.get('firstName')?.touched && registerForm.get('firstName')?.invalid"
            >
          </div>
          <div class="form-group">
            <label for="lastName">Last Name *</label>
            <input
              type="text"
              id="lastName"
              formControlName="lastName"
              placeholder="Enter your last name"
              [disabled]="loading"
              class="form-input"
              [class.input-error]="registerForm.get('lastName')?.touched && registerForm.get('lastName')?.invalid"
            >
          </div>
        </div>

        <div class="form-group">
          <label for="username">Username *</label>
          <input
            type="text"
            id="username"
            formControlName="username"
            placeholder="Choose a username"
            autocomplete="username"
            [disabled]="loading"
            class="form-input"
            [class.input-error]="registerForm.get('username')?.touched && registerForm.get('username')?.invalid"
          >
        </div>

        <div class="form-group">
          <label for="email">Email Address *</label>
          <input
            type="email"
            id="email"
            formControlName="email"
            placeholder="Enter your email address"
            autocomplete="email"
            [disabled]="loading"
            class="form-input"
            [class.input-error]="registerForm.get('email')?.touched && registerForm.get('email')?.invalid"
          >
          <small class="field-error" *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.hasError('email')">
            Please enter a valid email address
          </small>
        </div>

        <div class="form-group">
          <label for="phoneNumber">Phone Number</label>
          <input
            type="tel"
            id="phoneNumber"
            formControlName="phoneNumber"
            placeholder="Enter your phone number"
            autocomplete="tel"
            [disabled]="loading"
            class="form-input"
          >
        </div>

        <div class="form-group">
          <label for="password">Password *</label>
          <div class="input-wrapper">
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              formControlName="password"
              placeholder="At least 8 characters"
              autocomplete="new-password"
              [disabled]="loading"
              class="form-input"
              [class.input-error]="registerForm.get('password')?.touched && registerForm.get('password')?.invalid"
            >
            <button
              type="button"
              class="password-toggle"
              (click)="togglePasswordVisibility()"
              [disabled]="loading"
            >
              <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
            </button>
          </div>
          <small class="field-error" *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.hasError('minlength')">
            Password must be at least 8 characters long
          </small>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password *</label>
          <div class="input-wrapper">
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="confirmPassword"
              formControlName="confirmPassword"
              placeholder="Re-enter your password"
              autocomplete="new-password"
              [disabled]="loading"
              class="form-input"
              [class.input-error]="registerForm.get('confirmPassword')?.touched && registerForm.hasError('passwordMismatch')"
            >
          </div>
          <small class="field-error" *ngIf="registerForm.get('confirmPassword')?.touched && registerForm.hasError('passwordMismatch')">
            Passwords do not match
          </small>
        </div>

        <button
          type="submit"
          class="register-button"
          [disabled]="loading || registerForm.invalid"
          [class.loading]="loading"
        >
          <span *ngIf="!loading">
            <i class="fas fa-user-plus"></i>
            Create Account
          </span>
          <span *ngIf="loading" class="loading-content">
            <i class="fas fa-spinner fa-spin"></i>
            Creating Account...
          </span>
        </button>
      </form>

      <div class="register-footer">
        <p>Already have an account?</p>
        <button type="button" class="login-link" (click)="goToLogin()" [disabled]="loading">
          <i class="fas fa-sign-in-alt"></i>
          Sign In
        </button>
      </div>
    </div>
</div>
